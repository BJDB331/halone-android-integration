name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --stacktrace :app:assembleDebug 2>&1 | tee build.log || {
            grep -E '^e: |error:|What went wrong|Could not find|Could not resolve' -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with: { name: plugin-debug-apk, path: app/build/outputs/apk/debug/*.apk }
